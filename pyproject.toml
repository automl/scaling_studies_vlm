[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-bench"
version = "0.1.0"
description = "Surrogate benchmark library"
requires-python = ">=3.10"
dependencies = [
    "tabpfn"
]

[tool.setuptools.packages.find]
include = [
    "surrogate_benchmark",
    "surrogate_benchmark.*"
]

exclude = [
    "surrogate_benchmark.divergence_surrogate",
    "surrogate_benchmark.divergence_surrogate.*"
]
[tool.setuptools.package-data]
"surrogate_benchmark.performance_surrogate" = ["splits/*.csv"]